<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cluster Test Harness</title>
</head>
<body>
<!--
  Scenario test harness for the map cluster app.
  Serve the repo root (python -m http.server 8765) and open:
    http://localhost:8765/test/harness.html?debug
  harness.js copies index.html's styles + markup into this page, stubs fetch (Worker endpoints) and
  geolocation, loads ../app.js, then drives window.__tnc.onFix() with synthetic GPS fixes.
  Results: on-page panel, window.__testResults = [{name, status, detail}], window.__testsDone = true.
-->
<script>
  // 고친 harness.js 가 캐시 때문에 옛 버전으로 돌지 않게 매번 새로 받는다
  (function () { var s = document.createElement('script'); s.src = 'harness.js?t=' + Date.now(); document.body.appendChild(s); })();
</script>
</body>
</html>
