<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지도 클러스터</title>
<meta name="theme-color" content="#0b0d10">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #111418;
    --card: #0b0d10;
    --line: #232830;
    --text: #f2f4f7;
    --muted: #8b93a1;
    --accent: #03c75a;
    --warn: #ffb020;
    --bad: #ff5a5f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; touch-action: manipulation; }

  #app {
    display: grid;
    grid-template-columns: clamp(270px, 26vw, 380px) 1fr;
    height: 100vh; height: 100dvh;
  }

  /* ---------- 계기판 ---------- */
  #cluster {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 22px 24px; gap: 16px;
    min-width: 0;
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .gps { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); min-width: 0; }
  .gps span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--accent); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); }
  .clock { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip {
    font-size: 12px; font-weight: 700; color: #04130b; background: var(--warn);
    border-radius: 999px; padding: 3px 8px; margin-left: 6px;
  }
  #app:not(.demo) .chip { display: none; }

  .speedbox { margin-top: 3vh; }
  #speed {
    font-size: clamp(88px, 10vw, 170px); font-weight: 700; line-height: .9;
    letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 20px; color: var(--muted); margin-top: 8px; }

  .heading { display: flex; align-items: center; gap: 12px; font-size: 22px; }
  .compass {
    width: 46px; height: 46px; flex: none; border: 2px solid var(--line); border-radius: 50%;
    display: grid; place-items: center; color: var(--accent);
  }
  .compass svg { width: 24px; height: 24px; transition: transform .5s ease; }

  .trip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .stat .k { font-size: 13px; color: var(--muted); }
  .stat .v { font-size: 26px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat small { font-size: 14px; color: var(--muted); font-weight: 500; }

  /* ---------- 지도 ---------- */
  #map { position: relative; overflow: hidden; background: #1a1d22; min-width: 0; }
  .mapcanvas { position: absolute; inset: 0; }
  #map.night .mapcanvas { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9); }
  #map.night .me { filter: invert(1) hue-rotate(180deg); }

  .me { position: relative; width: 56px; height: 56px; pointer-events: none; }
  .me-halo { position: absolute; inset: 6px; border-radius: 50%; background: rgba(3, 199, 90, .18); }
  .me-dot {
    position: absolute; left: 18px; top: 18px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.35);
  }
  .me-arrow {
    position: absolute; left: 8px; top: 8px; width: 40px; height: 40px;
    fill: var(--accent); stroke: #fff; stroke-width: 2.5; stroke-linejoin: round;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.4));
    transition: transform .5s ease;
  }
  .me.nohead .me-arrow { display: none; }
  .me:not(.nohead) .me-dot { display: none; }
  .me-wrap { background: none; border: 0; }

  .badge {
    position: absolute; left: 12px; top: 12px; z-index: 1000;
    font-size: 13px; padding: 7px 12px; border-radius: 999px;
    background: rgba(17, 20, 24, .85); color: var(--muted);
    max-width: calc(100% - 260px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge.warn { color: var(--warn); }

  .toast {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 1100;
    width: max-content; max-width: min(620px, calc(100% - 120px));
    background: rgba(17, 20, 24, .95); color: var(--text);
    border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 12px; padding: 12px 16px; font-size: 16px; line-height: 1.45;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); cursor: pointer;
  }
  .toast.bad { border-left-color: var(--bad); }

  .topctrls { position: absolute; right: 16px; top: 16px; display: flex; gap: 10px; z-index: 1000; }
  .ctrls {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px; z-index: 1000;
  }
  .btn {
    width: 60px; height: 60px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.06); background: rgba(17, 20, 24, .9); color: #fff;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.28);
  }
  .btn:active { transform: scale(.96); }
  .btn svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #locate.alert { background: var(--accent); color: #04130b; }

  /* ---------- 설정 ---------- */
  #sheet {
    position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.55);
    display: grid; place-items: center; padding: 16px;
  }
  .sheet-card {
    width: min(560px, 100%); max-height: 100%; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px;
  }
  .sheet-card h2 { margin: 0 0 16px; font-size: 22px; }
  .sheet-card label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .sheet-card input {
    width: 100%; font: inherit; font-size: 18px; padding: 14px; border-radius: 12px;
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    -webkit-user-select: text; user-select: text;
  }
  .hint { font-size: 14px; color: var(--muted); line-height: 1.55; margin: 10px 0 0; }
  .hint b { color: var(--text); word-break: break-all; -webkit-user-select: text; user-select: text; }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; }
  .sheet-card button {
    min-height: 52px; padding: 0 18px; border-radius: 12px; cursor: pointer; font-size: 16px;
    background: #1b2027; color: var(--text); border: 1px solid var(--line);
  }
  .sheet-card button.primary { background: var(--accent); color: #04130b; border-color: transparent; font-weight: 700; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0 4px; }

  /* ---------- 세로 화면(휴대폰) ---------- */
  @media (orientation: portrait), (max-width: 720px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #cluster {
      border-right: 0; border-bottom: 1px solid var(--line);
      display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; padding: 12px 16px;
      grid-template-areas: "speed top" "speed head" "trip trip";
    }
    .top { grid-area: top; }
    .speedbox { grid-area: speed; margin-top: 0; align-self: center; }
    #speed { font-size: 72px; }
    .unit { font-size: 15px; margin-top: 4px; }
    .heading { grid-area: head; font-size: 18px; }
    .compass { width: 38px; height: 38px; }
    .trip { grid-area: trip; margin-top: 0; }
    .stat { padding: 8px 12px; }
    .stat .v { font-size: 20px; }
    .btn { width: 52px; height: 52px; }
    .badge { max-width: calc(100% - 210px); }
    .toast { max-width: calc(100% - 32px); }
  }
</style>
</head>
<body>
<div id="app">
  <section id="cluster" aria-label="계기판">
    <div class="top">
      <div class="gps"><span id="gpsDot" class="dot"></span><span id="gpsText">GPS 준비 중</span></div>
      <div><span id="clock" class="clock">--:--</span><span class="chip">데모</span></div>
    </div>
    <div class="speedbox">
      <div id="speed">0</div>
      <div class="unit">km/h</div>
    </div>
    <div class="heading">
      <div class="compass"><svg id="compassArrow" viewBox="0 0 24 24"><path d="M12 2.5 L18.5 20.5 L12 16.2 L5.5 20.5 Z" fill="currentColor"/></svg></div>
      <span id="headingText">방향 -</span>
    </div>
    <div class="trip">
      <div class="stat"><div class="k">주행 거리</div><div class="v"><span id="tripKm">0.0</span><small> km</small></div></div>
      <div class="stat"><div class="k">주행 시간</div><div class="v" id="tripTime">0:00</div></div>
    </div>
  </section>

  <section id="map" aria-label="지도">
    <div id="source" class="badge">지도 불러오는 중</div>
    <div id="toast" class="toast" hidden></div>
    <div class="topctrls">
      <button class="btn" id="nightBtn" aria-label="야간 지도"></button>
      <button class="btn" id="fsBtn" aria-label="전체화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn" id="setBtn" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
    </div>
    <div class="ctrls">
      <button class="btn" id="zin" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="btn" id="zout" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="btn" id="locate" aria-label="내 위치 따라가기"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>
  </section>
</div>

<div id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-label="설정">
    <h2>설정</h2>
    <label for="keyInput">네이버 지도 Client ID</label>
    <input id="keyInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="NCP 콘솔 → Maps → Application의 Client ID">
    <p class="hint">NCP 콘솔에서 Application을 만들 때 <b>Dynamic Map</b>을 켜고, Web 서비스 URL에 지금 주소 <b id="origin"></b> 를 등록해야 지도가 뜹니다.</p>
    <div class="row">
      <button id="saveKey" class="primary">저장하고 다시 불러오기</button>
      <button id="clearKey">키 지우기</button>
    </div>
    <hr>
    <div class="row">
      <button id="demoBtn">데모 주행 시작</button>
      <button id="resetTrip">주행 기록 초기화</button>
    </div>
    <div class="row end"><button id="closeSheet">닫기</button></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const NS = 'tnc.';
  const store = {
    get(k) { try { return localStorage.getItem(NS + k); } catch (e) { return null; } },
    set(k, v) {
      try {
        if (v == null || v === '') localStorage.removeItem(NS + k);
        else localStorage.setItem(NS + k, String(v));
      } catch (e) { /* 저장 불가 환경: 이번 세션만 사용 */ }
    },
  };

  const DEFAULT_CENTER = { lat: 37.5658, lng: 126.9772 }; // 서울시청
  const LEAFLET_JS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
  const LEAFLET_CSS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
  const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  const state = {
    fix: null,          // 마지막 위치 {lat,lng,acc,t}
    speedKmh: 0,
    heading: null,
    trip: 0,            // m
    driveMs: 0,
    following: true,
    refollowTimer: 0,
    demoTimer: 0,
    night: store.get('night') === '1',
  };

  // URL에 ?key=... 로 넘기면 저장하고 주소에서는 지운다 (테슬라 즐겨찾기 첫 설정용)
  const params = new URLSearchParams(location.search);
  if (params.get('key')) {
    store.set('key', params.get('key').trim());
    params.delete('key');
    const qs = params.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
  }

  // ---------- 계산 도우미 ----------
  const toRad = (d) => d * Math.PI / 180;
  const toDeg = (r) => r * 180 / Math.PI;
  function haversine(a, b) {
    const R = 6371000;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function bearing(a, b) {
    const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
    const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) -
              Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  const DIRS = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
  const dirName = (h) => DIRS[Math.round(h / 45) % 8];
  // 350° → 10° 로 갈 때 한 바퀴 돌지 않게 누적 각도로 회전
  function makeRotator(el) {
    let cur = null;
    return (h) => {
      if (cur === null) cur = h;
      else cur += ((h - cur) % 360 + 540) % 360 - 180;
      el.style.transform = 'rotate(' + cur + 'deg)';
    };
  }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('load failed: ' + src));
      document.head.appendChild(s);
    });
  }
  function loadCss(href) {
    return new Promise((resolve) => {
      const l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = href;
      l.onload = l.onerror = () => resolve();
      document.head.appendChild(l);
    });
  }

  // ---------- 알림 ----------
  let toastTimer = 0;
  function toast(msg, kind, ms) {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast ' + (kind || '');
    t.hidden = false;
    clearTimeout(toastTimer);
    if (ms !== 0) toastTimer = setTimeout(() => { t.hidden = true; }, ms || 4000);
  }
  $('#toast').addEventListener('click', () => { $('#toast').hidden = true; });

  // ---------- 내 위치 마커 ----------
  const meEl = document.createElement('div');
  meEl.className = 'me nohead';
  meEl.innerHTML = '<div class="me-halo"></div><div class="me-dot"></div>' +
    '<svg class="me-arrow" viewBox="0 0 40 40"><path d="M20 3 L33 35 L20 27.5 L7 35 Z"/></svg>';
  const rotateMe = makeRotator(meEl.querySelector('.me-arrow'));
  const rotateCompass = makeRotator($('#compassArrow'));

  // ---------- 지도 어댑터 (네이버 / 테스트용 OSM) ----------
  const NaverAdapter = {
    init(el, c) {
      const N = naver.maps;
      this.map = new N.Map(el, {
        center: new N.LatLng(c.lat, c.lng), zoom: 17, minZoom: 7,
        zoomControl: false, mapTypeControl: false, scaleControl: false,
      });
      this.marker = new N.Marker({
        position: new N.LatLng(c.lat, c.lng), map: this.map, visible: false, clickable: false, zIndex: 1000,
        icon: { content: meEl, anchor: new N.Point(28, 28) },
      });
      N.Event.addListener(this.map, 'dragstart', onUserPan);
    },
    setMe(lat, lng) {
      this.marker.setPosition(new naver.maps.LatLng(lat, lng));
      this.marker.setVisible(true);
    },
    center(lat, lng, jump) {
      const p = new naver.maps.LatLng(lat, lng);
      if (jump) this.map.setCenter(p); else this.map.panTo(p);
    },
    zoomBy(d) { this.map.setZoom(this.map.getZoom() + d, true); },
    destroy() { if (this.map) this.map.destroy(); this.map = null; this.marker = null; },
  };

  const LeafletAdapter = {
    async init(el, c) {
      await loadCss(LEAFLET_CSS);
      if (!window.L) await loadScript(LEAFLET_JS);
      this.map = L.map(el, { zoomControl: false }).setView([c.lat, c.lng], 17);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap',
      }).addTo(this.map);
      this.marker = null;
      this.map.on('dragstart', onUserPan);
    },
    setMe(lat, lng) {
      if (this.marker) { this.marker.setLatLng([lat, lng]); return; }
      this.marker = L.marker([lat, lng], {
        icon: L.divIcon({ html: meEl, className: 'me-wrap', iconSize: [56, 56], iconAnchor: [28, 28] }),
        interactive: false, keyboard: false, zIndexOffset: 1000,
      }).addTo(this.map);
    },
    center(lat, lng, jump) {
      if (jump) this.map.setView([lat, lng], this.map.getZoom(), { animate: false });
      else this.map.panTo([lat, lng], { animate: true, duration: 0.9 });
    },
    zoomBy(d) { this.map.setZoom(this.map.getZoom() + d); },
    destroy() { if (this.map) this.map.remove(); this.map = null; this.marker = null; },
  };

  let mapA = null;
  async function useMap(adapter) {
    if (mapA) { try { mapA.destroy(); } catch (e) { /* 무시 */ } mapA = null; }
    const host = $('#map');
    host.querySelectorAll('.mapcanvas').forEach((n) => n.remove());
    const el = document.createElement('div');
    el.className = 'mapcanvas';
    host.prepend(el);
    await adapter.init(el, state.fix || DEFAULT_CENTER);
    mapA = adapter;
    if (state.fix) mapA.setMe(state.fix.lat, state.fix.lng);
  }

  function setSource(text, warn) {
    const b = $('#source');
    b.textContent = text;
    b.classList.toggle('warn', !!warn);
  }

  let fallbackStarted = false;
  async function fallbackMap(reason) {
    if (reason) toast(reason, 'bad', 10000);
    if (fallbackStarted) return; // 인증 실패 콜백과 로드 실패가 겹쳐도 한 번만 전환
    fallbackStarted = true;
    try {
      await useMap(LeafletAdapter);
      setSource('테스트 지도 (OpenStreetMap) · 설정에서 네이버 키 입력', true);
    } catch (e) {
      setSource('지도를 불러오지 못했습니다', true);
    }
  }

  // 네이버 지도 스크립트가 인증 실패 시 호출하는 전역 함수
  let naverFailed = false;
  window.navermap_authFailure = function () {
    if (naverFailed) return;
    naverFailed = true;
    fallbackMap('네이버 지도 인증 실패: Client ID와 Web 서비스 URL(' + location.origin + ') 등록을 확인하세요.');
  };

  async function bootMap() {
    const key = store.get('key');
    if (!key) { await fallbackMap(null); return; }
    try {
      await loadScript('https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(key));
      if (!(window.naver && naver.maps && naver.maps.Map)) throw new Error('naver.maps missing');
      if (naverFailed) return;
      await useMap(NaverAdapter);
      setSource('네이버 지도', false);
    } catch (e) {
      if (!naverFailed) await fallbackMap('네이버 지도 스크립트를 불러오지 못했습니다. 네트워크나 키를 확인하세요.');
    }
  }

  // ---------- 위치 처리 ----------
  function setGps(kind, text) {
    $('#gpsDot').className = 'dot ' + (kind || '');
    $('#gpsText').textContent = text;
  }

  function onFix(f) {
    const prev = state.fix;
    let v = Number.isFinite(f.speed) && f.speed >= 0 ? f.speed : null; // m/s
    let h = Number.isFinite(f.heading) ? f.heading : null;

    if (prev) {
      const dt = (f.t - prev.t) / 1000;
      const d = haversine(prev, f);
      if (dt > 0 && dt < 30) {
        // 브라우저가 속도를 안 주면 두 지점 거리로 계산 (정확도 이내 흔들림은 정지로 본다)
        if (v === null) v = d > Math.max(3, (f.acc || 10) * 0.4) ? d / dt : 0;
        if (v * 3.6 > 3 && d < 70 * dt) { state.trip += d; state.driveMs += dt * 1000; }
        if (h === null && d > 4) h = bearing(prev, f);
      }
    }

    const kmh = (v || 0) * 3.6;
    state.speedKmh = kmh < 2 ? 0 : kmh;
    if (h !== null && state.speedKmh >= 3) state.heading = h; // 정지 중 GPS 방향은 믿지 않음
    state.fix = f;

    const acc = Math.round(f.acc || 0);
    setGps(acc <= 25 ? 'ok' : 'warn', 'GPS ±' + acc + 'm');
    render();
    if (mapA) {
      mapA.setMe(f.lat, f.lng);
      if (state.following) mapA.center(f.lat, f.lng, !prev);
    }
  }

  function startGps() {
    if (!window.isSecureContext) {
      setGps('bad', 'HTTPS 필요');
      toast('위치는 HTTPS 주소에서만 쓸 수 있습니다.', 'bad', 0);
      return;
    }
    if (!('geolocation' in navigator)) { setGps('bad', '위치 미지원 브라우저'); return; }
    setGps('warn', 'GPS 신호 찾는 중');
    navigator.geolocation.watchPosition((p) => {
      if (state.demoTimer) return;
      onFix({
        lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy,
        speed: p.coords.speed, heading: p.coords.heading, t: p.timestamp || Date.now(),
      });
    }, (err) => {
      if (state.demoTimer) return;
      if (err.code === 1) {
        setGps('bad', '위치 권한 꺼짐');
        toast('위치 권한을 허용해야 속도와 현재 위치가 표시됩니다.', 'bad', 0);
      } else {
        setGps('warn', err.code === 3 ? 'GPS 신호 약함' : 'GPS 오류');
      }
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  }

  // ---------- 화면 갱신 ----------
  function fmtDur(ms) {
    const m = Math.floor(ms / 60000);
    return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  }
  function render() {
    $('#speed').textContent = Math.round(state.speedKmh);
    if (state.heading !== null) {
      $('#headingText').textContent = dirName(state.heading) + ' · ' + Math.round(state.heading) + '°';
      rotateCompass(state.heading);
      rotateMe(state.heading);
      meEl.classList.remove('nohead');
    } else {
      $('#headingText').textContent = '방향 -';
      meEl.classList.add('nohead');
    }
    $('#tripKm').textContent = (state.trip / 1000).toFixed(1);
    $('#tripTime').textContent = fmtDur(state.driveMs);
  }
  function tickClock() {
    const d = new Date();
    $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // ---------- 따라가기 ----------
  function setFollowing(on) {
    state.following = on;
    $('#locate').classList.toggle('alert', !on);
    clearTimeout(state.refollowTimer);
    if (on && state.fix && mapA) mapA.center(state.fix.lat, state.fix.lng, false);
    if (!on) state.refollowTimer = setTimeout(() => setFollowing(true), 15000); // 15초 손 안 대면 복귀
  }
  function onUserPan() { setFollowing(false); }

  // ---------- 데모 주행 (차 없이 화면 확인용) ----------
  const DEMO_ROUTE = [
    { lat: 37.5658, lng: 126.9772 }, // 서울시청
    { lat: 37.5712, lng: 126.9769 }, // 세종로 사거리
    { lat: 37.5757, lng: 126.9768 }, // 광화문 앞
    { lat: 37.5762, lng: 126.9806 }, // 동십자각
    { lat: 37.5765, lng: 126.9856 }, // 안국역
    { lat: 37.5706, lng: 126.9880 }, // 종로2가
    { lat: 37.5700, lng: 126.9830 }, // 종각
    { lat: 37.5693, lng: 126.9790 }, // 청계광장
  ];
  const DEMO_STOPS = new Set([2, 4, 6]); // 신호 대기 지점

  function startDemo() {
    stopDemo(true);
    state.fix = null; state.trip = 0; state.driveMs = 0; state.heading = null;
    const n = DEMO_ROUTE.length;
    let seg = 0, along = 0, v = 0, stopLeft = 0, last = Date.now();

    const tick = () => {
      const now = Date.now();
      const dt = Math.min(2, (now - last) / 1000);
      last = now;
      if (stopLeft > 0) {
        stopLeft -= dt; v = 0;
      } else {
        const next = (seg + 1) % n;
        const len = haversine(DEMO_ROUTE[seg], DEMO_ROUTE[next]);
        const remain = len - along;
        const stopHere = DEMO_STOPS.has(next);
        let target = 15; // m/s ≈ 54 km/h
        if (stopHere && remain < v * v / (2 * 2.5) + 14) target = 0;
        else if (!stopHere && remain < 45) target = 7; // 코너 감속
        v = target > v ? Math.min(target, v + 2.0 * dt) : Math.max(target, v - 2.8 * dt);
        if (stopHere && target === 0 && v < 1.2) v = 1.2; // 정지선까지 서행
        along += v * dt;
        if (along >= len) {
          if (stopHere) { along = 0; v = 0; stopLeft = 5; } else { along -= len; }
          seg = next;
        }
      }
      const a = DEMO_ROUTE[seg], b = DEMO_ROUTE[(seg + 1) % n];
      const r = Math.min(1, along / haversine(a, b));
      onFix({
        lat: a.lat + (b.lat - a.lat) * r, lng: a.lng + (b.lng - a.lng) * r,
        acc: 5, speed: v, heading: bearing(a, b), t: now,
      });
    };

    tick();
    state.demoTimer = setInterval(tick, 1000);
    $('#app').classList.add('demo');
    toast('데모 주행 중 · 설정에서 멈출 수 있어요', '', 3000);
  }

  function stopDemo(silent) {
    if (!state.demoTimer) return;
    clearInterval(state.demoTimer);
    state.demoTimer = 0;
    state.fix = null; state.speedKmh = 0; state.heading = null;
    render();
    $('#app').classList.remove('demo');
    setGps('warn', 'GPS 신호 찾는 중');
    if (!silent) toast('데모를 멈췄습니다.', '', 2500);
  }

  // ---------- 버튼 ----------
  $('#zin').onclick = () => mapA && mapA.zoomBy(1);
  $('#zout').onclick = () => mapA && mapA.zoomBy(-1);
  $('#locate').onclick = () => setFollowing(true);

  function applyNight() {
    $('#map').classList.toggle('night', state.night);
    $('#nightBtn').innerHTML = state.night ? ICON_SUN : ICON_MOON;
    $('#nightBtn').setAttribute('aria-label', state.night ? '주간 지도' : '야간 지도');
  }
  $('#nightBtn').onclick = () => {
    state.night = !state.night;
    store.set('night', state.night ? '1' : null);
    applyNight();
  };

  const d = document;
  if (!(d.fullscreenEnabled || d.webkitFullscreenEnabled)) $('#fsBtn').hidden = true;
  $('#fsBtn').onclick = () => {
    if (d.fullscreenElement || d.webkitFullscreenElement) {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      return;
    }
    const el = d.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    const p = req.call(el);
    if (p && p.catch) p.catch(() => toast('이 브라우저에서는 전체화면이 막혀 있습니다.', '', 4000));
  };

  const sheet = $('#sheet');
  function updateDemoBtn() { $('#demoBtn').textContent = state.demoTimer ? '데모 주행 멈추기' : '데모 주행 시작'; }
  $('#setBtn').onclick = () => {
    $('#keyInput').value = store.get('key') || '';
    $('#origin').textContent = location.origin;
    updateDemoBtn();
    sheet.hidden = false;
  };
  $('#closeSheet').onclick = () => { sheet.hidden = true; };
  sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.hidden = true; });
  $('#saveKey').onclick = () => { store.set('key', $('#keyInput').value.trim() || null); location.reload(); };
  $('#clearKey').onclick = () => { store.set('key', null); location.reload(); };
  $('#resetTrip').onclick = () => {
    state.trip = 0; state.driveMs = 0; render();
    sheet.hidden = true;
    toast('주행 기록을 초기화했습니다.', '', 2500);
  };
  $('#demoBtn').onclick = () => {
    if (state.demoTimer) stopDemo(false); else startDemo();
    updateDemoBtn();
    sheet.hidden = true;
  };

  // ---------- 시작 ----------
  applyNight();
  render();
  tickClock();
  setInterval(tickClock, 1000);
  bootMap();
  startGps();
  if (params.has('demo')) startDemo();
})();
</script>
</body>
</html>
